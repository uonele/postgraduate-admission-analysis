name: Deploy MkDocs Site
on:
  push:
    branches:
      - main
      - master
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material 
      - name: Build CI config and deploy
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          config_path = Path("mkdocs.yml")
          config = yaml.safe_load(config_path.read_text(encoding="utf-8"))
          config["docs_dir"] = os.environ["GITHUB_WORKSPACE"]
          config["site_dir"] = str(Path(os.environ["RUNNER_TEMP"]) / "mkdocs-site")
          Path("mkdocs.ci.yml").write_text(
              yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )
          PY
          mkdocs gh-deploy --force -f mkdocs.ci.yml
